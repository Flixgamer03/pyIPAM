# nginx reverse proxy for pyIPAM
#   RHEL/CentOS/Fedora: /etc/nginx/conf.d/pyipam.conf
#   Debian/Ubuntu:      /etc/nginx/sites-available/pyipam.conf (+ symlink to sites-enabled)
# Replace ipam.example.com and the certificate paths, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ipam.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25.1: use "listen 443 ssl http2;" instead
    server_name ipam.example.com;

    ssl_certificate     /etc/nginx/ssl/ipam.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ipam.example.com.key;

    client_max_body_size 20m;       # CSV import / backup restore

    # Optional: restrict access to your LAN
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;    # a ping scan of a /22 can take a while
    }
}

# HTTP only (no certificate yet): delete the first server block, and in the second one
# replace the two "listen ... 443 ssl" lines with "listen 80;" / "listen [::]:80;"
# and remove the "http2" and "ssl_certificate*" lines.
